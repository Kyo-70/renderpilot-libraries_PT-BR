name: Setup library catalog tooling
description: Install the repository-pinned Node.js and pnpm toolchain

inputs:
  install:
    description: Whether pnpm/setup runs pnpm install automatically
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup pnpm and Node
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        runtime: node@24.20.0
        cache: true
        require-lockfile: true
        install: ${{ inputs.install }}
